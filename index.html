<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>立ち退きません！ ～地下のわけあり荘～</title>
  <meta name="description" content="掘って、住まわせて、立ち退き業者を撃退！">
  <style>
    :root{color-scheme:dark;background:#30251d}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    #game-viewport{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
        env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
      overflow:hidden;background:#30251d;
    }
    #game-fit{position:relative;flex:none;width:0;height:0;overflow:visible}
    #game-frame{
      position:absolute;left:0;top:0;width:1890px;height:1027px;
      border:0;display:block;transform-origin:top left;transform:scale(var(--game-scale,1));
      background:#30251d;
    }
  </style>
</head>
<body>
  <main id="game-viewport">
    <div id="game-fit"><iframe id="game-frame" title="立ち退きません！ ゲーム画面" src="game.html" allowfullscreen></iframe></div>
  </main>
  <script src="responsive-shell.js"></script>
</body>
</html>
